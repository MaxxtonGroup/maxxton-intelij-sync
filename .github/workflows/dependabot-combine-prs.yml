# This file is managed by Terraform, please contact devsecops team for changes

name: "Dependabot Combine PRs"

# Runs well after this repository's weekly Dependabot run (see dependabot.yml).
on:
  schedule:
    - cron: "0 14 * * 0"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  combine-prs:
    runs-on: ubuntu-latest
    steps:
      # Workflows triggered with GITHUB_TOKEN are held for manual approval on the combined PR,
      # so the App's token is used. Until the App is set up, combining goes on without it.
      - name: Create a token for the combiner App
        id: app-token
        if: vars.COMBINER_APP_CLIENT_ID != ''
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.COMBINER_APP_CLIENT_ID }}
          private-key: ${{ secrets.COMBINER_APP_PRIVATE_KEY }}
      - name: Warn that the combiner App is not configured
        if: vars.COMBINER_APP_CLIENT_ID == ''
        run: echo "::warning::COMBINER_APP_CLIENT_ID is not set, combining with GITHUB_TOKEN; the combined PR's workflows will wait for approval."
      - name: Combine dependency pull requests
        uses: github/combine-prs@v5.2.0
        with:
          github_token: ${{ steps.app-token.outputs.token || github.token }}
          # Conventional, so repositories that release from commit messages cut a patch.
          pr_title: "fix(deps): weekly dependency updates"
          labels: combined-pr,ai-check
          # A single Dependabot PR must still become a labelled combined PR.
          min_combine_number: 1
          branch_regex: "^(dependabot|renovate)/"
          # The combined PR's own CI is the gate.
          # Label a pull request `nocombine` to keep it out (e.g. a major-version fix).
          ci_required: false
          create_from_scratch: true
